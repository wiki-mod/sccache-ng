name: build_sccache

on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "0 2 * * 0"
    - cron: "0 3 * * 0"
    - cron: "11 3 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: nightly
        options:
          - nightly
          - builder
          - packages
          - gc
          - verify
          - deps-weekly
          - deps-update
          - deps-actions-verify
          - deps-verify
      force:
        type: boolean
        required: true
        default: false
      publish:
        type: boolean
        required: true
        default: true
      upstream_ref:
        type: string
        required: true
        default: main
      arch:
        type: choice
        required: true
        default: all
        options:
          - all
          - amd64
          - arm64
      cleanup:
        type: boolean
        required: true
        default: true
      debug:
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  packages: write
  issues: write
  attestations: write
  id-token: write

jobs:
  plan:
    if: ${{ github.event.schedule != '11 3 * * 0' && (github.event_name != 'workflow_dispatch' || !startsWith(inputs.mode, 'deps-')) }}
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.admission.outputs.decision }}
      upstream_sha: ${{ steps.admission.outputs.upstream_sha }}
      image: ${{ steps.admission.outputs.image }}
      builder_image: ${{ steps.admission.outputs.builder_image }}
      version: ${{ steps.admission.outputs.version }}
      run_builder: ${{ steps.admission.outputs.run_builder }}
    steps:
      - uses: actions/checkout@v4
      - id: admission
        run: bash ./scripts/ci/ci.sh admission
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: admission
          FORCE: ${{ inputs.force || 'false' }}
          PUBLISH: ${{ inputs.publish || 'true' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          ARCH: ${{ inputs.arch || 'all' }}
          REQUESTED_MODE: ${{ inputs.mode || 'nightly' }}
          REQUESTED_ARCH: ${{ inputs.arch || 'all' }}
          DEBUG: ${{ inputs.debug || 'false' }}

  build-builder:
    name: builder ${{ matrix.arch }}
    needs: plan
    if: ${{ github.event.schedule != '11 3 * * 0' && (github.event_name != 'workflow_dispatch' || !startsWith(inputs.mode, 'deps-')) && needs.plan.outputs.run_builder == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/ci/ci.sh build-builder
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.arch == 'all' || inputs.arch == matrix.arch }}
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: build-builder
          PUBLISH: ${{ inputs.publish || 'true' }}
          ARCH: ${{ matrix.arch }}
          REQUESTED_MODE: ${{ inputs.mode || 'nightly' }}
          REQUESTED_ARCH: ${{ inputs.arch || 'all' }}
          DEBUG: ${{ inputs.debug || 'false' }}
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.arch == 'all' || inputs.arch == matrix.arch }}
        with:
          name: builder-${{ matrix.arch }}
          path: dist/sccache-ng/metadata
          if-no-files-found: error
          retention-days: 14

  promote-builder:
    name: promote builder
    needs: [plan, build-builder]
    if: ${{ github.event.schedule != '11 3 * * 0' && (github.event_name != 'workflow_dispatch' || !startsWith(inputs.mode, 'deps-')) && needs.plan.outputs.run_builder == 'true' && (github.event_name != 'workflow_dispatch' || inputs.arch == 'all') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: builder-*
          path: dist/sccache-ng/metadata
          merge-multiple: true
      - run: bash ./scripts/ci/ci.sh promote-builder
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: promote-builder
          PUBLISH: ${{ inputs.publish || 'true' }}
          REQUESTED_MODE: ${{ inputs.mode || 'nightly' }}
          DEBUG: ${{ inputs.debug || 'false' }}

  build-packages:
    name: packages ${{ matrix.arch }}
    needs: [plan, promote-builder]
    if: ${{ github.event.schedule != '11 3 * * 0' && (github.event_name != 'workflow_dispatch' || !startsWith(inputs.mode, 'deps-')) && always() && (needs.plan.outputs.decision == 'build' || inputs.mode == 'packages') && (needs.plan.outputs.run_builder != 'true' || needs['promote-builder'].result == 'success') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dist/sccache-ng/cache
          key: sccache-ng-${{ matrix.arch }}-${{ needs.plan.outputs.upstream_sha }}-${{ hashFiles('scripts/ci/ci.sh') }}
          restore-keys: |
            sccache-ng-${{ matrix.arch }}-
      - run: bash ./scripts/ci/ci.sh build-packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.arch == 'all' || inputs.arch == matrix.arch }}
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: build-packages
          PUBLISH: ${{ inputs.publish || 'true' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          ARCH: ${{ matrix.arch }}
          REQUESTED_ARCH: ${{ inputs.arch || 'all' }}
          DEBUG: ${{ inputs.debug || 'false' }}
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.arch == 'all' || inputs.arch == matrix.arch }}
        with:
          name: outputs-${{ matrix.arch }}
          path: dist/sccache-ng
          if-no-files-found: error
          retention-days: 14

  promote:
    name: promote
    needs: [plan, build-packages]
    if: ${{ github.event.schedule != '11 3 * * 0' && (github.event_name != 'workflow_dispatch' || !startsWith(inputs.mode, 'deps-')) && (needs.plan.outputs.decision == 'build' || inputs.mode == 'packages') && (github.event_name != 'workflow_dispatch' || inputs.arch == 'all') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: outputs-*
          path: dist/sccache-ng
          merge-multiple: true
      - run: bash ./scripts/ci/ci.sh promote
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: promote
          PUBLISH: ${{ inputs.publish || 'true' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          DEBUG: ${{ inputs.debug || 'false' }}
      - run: bash ./scripts/ci/ci.sh publish-release
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: publish-release
          PUBLISH: ${{ inputs.publish || 'true' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          DEBUG: ${{ inputs.debug || 'false' }}
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/sccache-ng
      - uses: actions/attest-sbom@v1
        with:
          subject-path: dist/sccache-ng
          sbom-path: dist/sccache-ng/sbom.spdx.json
      - run: bash ./scripts/ci/ci.sh close-failure
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: close-failure
          PUBLISH: ${{ inputs.publish || 'true' }}
      - run: bash ./scripts/ci/ci.sh gc
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: gc
          PUBLISH: ${{ inputs.publish || 'true' }}
          CLEANUP: ${{ inputs.cleanup || 'true' }}

  gc:
    name: gc
    if: ${{ inputs.mode == 'gc' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/ci/ci.sh gc
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: gc
          PUBLISH: ${{ inputs.publish || 'true' }}
          CLEANUP: ${{ inputs.cleanup || 'true' }}

  verify:
    name: verify
    if: ${{ github.event.schedule != '11 3 * * 0' && inputs.mode == 'verify' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/ci/ci.sh verify
        env:
          MODE: verify
          ARCH: ${{ inputs.arch || 'all' }}
          DEBUG: ${{ inputs.debug || 'false' }}

  deps:
    name: deps ${{ inputs.mode || 'deps-weekly' }}
    if: ${{ github.event.schedule == '11 3 * * 0' || startsWith(inputs.mode, 'deps-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROJECT_AUTOMATION_PAT || github.token }}
      - run: bash ./scripts/ci/ci.sh "${MODE}"
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event.schedule == '11 3 * * 0' && 'deps-weekly' || inputs.mode }}
          PUBLISH: ${{ inputs.publish || 'true' }}
          DEBUG: ${{ inputs.debug || 'false' }}

  report-failure:
    name: report failure
    needs: [plan, build-builder, promote-builder, build-packages, promote, deps]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/ci/ci.sh report-failure
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: report-failure
          PUBLISH: ${{ inputs.publish || 'true' }}
