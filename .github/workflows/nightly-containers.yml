name: sccache-ng nightly

on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "0 2 * * 0"
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: nightly
        options:
          - nightly
          - builder
          - packages
          - gc
          - verify
      force:
        type: boolean
        required: true
        default: false
      publish:
        type: boolean
        required: true
        default: true
      upstream_ref:
        type: string
        required: true
        default: main
      arch:
        type: choice
        required: true
        default: all
        options:
          - all
          - amd64
          - arm64
      cleanup:
        type: boolean
        required: true
        default: true
      debug:
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write
  issues: write
  attestations: write
  id-token: write

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.admission.outputs.decision }}
      upstream_sha: ${{ steps.admission.outputs.upstream_sha }}
      image: ${{ steps.admission.outputs.image }}
      builder_image: ${{ steps.admission.outputs.builder_image }}
      version: ${{ steps.admission.outputs.version }}
      run_builder: ${{ steps.admission.outputs.run_builder }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: admission
        run: bash ./scripts/ci/ci.sh admission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: admission
          FORCE: ${{ inputs.force || 'false' }}
          PUBLISH: ${{ inputs.publish || 'true' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          ARCH: ${{ inputs.arch || 'all' }}
          REQUESTED_MODE: ${{ inputs.mode || 'nightly' }}
          REQUESTED_ARCH: ${{ inputs.arch || 'all' }}
          DEBUG: ${{ inputs.debug || 'false' }}

  build-builder:
    name: builder ${{ matrix.arch }}
    needs: plan
    if: ${{ needs.plan.outputs.run_builder == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: bash ./scripts/ci/ci.sh build-builder
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.arch == 'all' || inputs.arch == matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: build-builder
          PUBLISH: ${{ inputs.publish || 'true' }}
          ARCH: ${{ matrix.arch }}
          REQUESTED_MODE: ${{ inputs.mode || 'nightly' }}
          REQUESTED_ARCH: ${{ inputs.arch || 'all' }}
          DEBUG: ${{ inputs.debug || 'false' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.arch == 'all' || inputs.arch == matrix.arch }}
        with:
          name: builder-${{ matrix.arch }}
          path: dist/sccache-ng/metadata
          if-no-files-found: error
          retention-days: 14

  promote-builder:
    name: promote builder
    needs: [plan, build-builder]
    if: ${{ needs.plan.outputs.run_builder == 'true' && (github.event_name != 'workflow_dispatch' || inputs.arch == 'all') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: builder-*
          path: dist/sccache-ng/metadata
          merge-multiple: true
      - run: bash ./scripts/ci/ci.sh promote-builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: promote-builder
          PUBLISH: ${{ inputs.publish || 'true' }}
          REQUESTED_MODE: ${{ inputs.mode || 'nightly' }}
          DEBUG: ${{ inputs.debug || 'false' }}

  build-packages:
    name: packages ${{ matrix.arch }}
    needs: [plan, promote-builder]
    if: ${{ always() && (needs.plan.outputs.decision == 'build' || inputs.mode == 'packages') && (needs.plan.outputs.run_builder != 'true' || needs.promote-builder.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dist/sccache-ng/cache
          key: sccache-ng-${{ matrix.arch }}-${{ needs.plan.outputs.upstream_sha }}-${{ hashFiles('scripts/ci/ci.sh') }}
          restore-keys: |
            sccache-ng-${{ matrix.arch }}-
      - run: bash ./scripts/ci/ci.sh build-packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.arch == 'all' || inputs.arch == matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: build-packages
          PUBLISH: ${{ inputs.publish || 'true' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          ARCH: ${{ matrix.arch }}
          REQUESTED_ARCH: ${{ inputs.arch || 'all' }}
          DEBUG: ${{ inputs.debug || 'false' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.arch == 'all' || inputs.arch == matrix.arch }}
        with:
          name: outputs-${{ matrix.arch }}
          path: dist/sccache-ng
          if-no-files-found: error
          retention-days: 14

  promote:
    name: promote
    needs: [plan, build-packages]
    if: ${{ (needs.plan.outputs.decision == 'build' || inputs.mode == 'packages') && (github.event_name != 'workflow_dispatch' || inputs.arch == 'all') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: outputs-*
          path: dist/sccache-ng
          merge-multiple: true
      - run: bash ./scripts/ci/ci.sh promote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: promote
          PUBLISH: ${{ inputs.publish || 'true' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          DEBUG: ${{ inputs.debug || 'false' }}
      - run: bash ./scripts/ci/ci.sh publish-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: publish-release
          PUBLISH: ${{ inputs.publish || 'true' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          DEBUG: ${{ inputs.debug || 'false' }}
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-checksums: dist/sccache-ng/SHA256SUMS
      - uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f
        with:
          subject-checksums: dist/sccache-ng/SHA256SUMS
          sbom-path: dist/sccache-ng/sbom.spdx.json
      - run: bash ./scripts/ci/ci.sh close-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: close-failure
          PUBLISH: ${{ inputs.publish || 'true' }}
      - run: bash ./scripts/ci/ci.sh gc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: gc
          PUBLISH: ${{ inputs.publish || 'true' }}
          CLEANUP: ${{ inputs.cleanup || 'true' }}

  gc:
    name: gc
    if: ${{ inputs.mode == 'gc' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: bash ./scripts/ci/ci.sh gc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: gc
          PUBLISH: ${{ inputs.publish || 'true' }}
          CLEANUP: ${{ inputs.cleanup || 'true' }}

  verify:
    name: verify
    if: ${{ inputs.mode == 'verify' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: bash ./scripts/ci/ci.sh verify
        env:
          MODE: verify
          ARCH: ${{ inputs.arch || 'all' }}
          DEBUG: ${{ inputs.debug || 'false' }}

  report-failure:
    name: report failure
    needs: [plan, build-builder, promote-builder, build-packages, promote]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: bash ./scripts/ci/ci.sh report-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: report-failure
          PUBLISH: ${{ inputs.publish || 'true' }}
