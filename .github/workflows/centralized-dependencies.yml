name: centralized dependencies

on:
  schedule:
    - cron: "11 3 * * 0"
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: true
      debug:
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    name: update
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PROJECT_AUTOMATION_PAT || github.token }}
      - run: bash ./scripts/ci/ci.sh deps-weekly
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: deps-weekly
          PUBLISH: ${{ inputs.publish || 'true' }}
          DEBUG: ${{ inputs.debug || 'false' }}

  report-failure:
    name: report failure
    needs: update
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: bash ./scripts/ci/ci.sh report-failure
        env:
          PROJECT_AUTOMATION_PAT: ${{ secrets.PROJECT_AUTOMATION_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: report-failure
          PUBLISH: ${{ inputs.publish || 'true' }}
